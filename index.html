<title>Pricing — Gestão de Projetos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#EEF2F7;--white:#FFFFFF;--border:#E8E6E0;--border2:#D0CEC7;
    --text:#1A1918;--muted:#706E68;--light:#A09E98;--accent:#6366F1;--accent-dk:#4F46E5;--header:#1B5EC5;
    --s-inbox-bg:#EEEDFE;--s-inbox-fg:#4740B6;
    --s-doing-bg:#FEF3C7;--s-doing-fg:#92400E;
    --s-valid-bg:#E0F2FE;--s-valid-fg:#075985;
    --s-done-bg:#D1FAE5;--s-done-fg:#065F46;
    --s-block-bg:#FEE2E2;--s-block-fg:#991B1B;
    --p-high-bg:#FEE2E2;--p-high-fg:#991B1B;
    --p-med-bg:#FEF3C7;--p-med-fg:#92400E;
    --p-low-bg:#D1FAE5;--p-low-fg:#065F46;
    --radius:10px;--radius-sm:6px;
    --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.12);
  }
  html,body{height:100%;font-family:-apple-system,'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

  /* LOGIN */
  #login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
  .login-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;box-shadow:var(--shadow-lg);text-align:center;}
  .login-logo{width:52px;height:52px;background:var(--accent);border-radius:14px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;letter-spacing:-1px;}
  .login-card h1{font-size:20px;font-weight:700;margin-bottom:6px;}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:28px;}
  .login-card input{width:100%;padding:10px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border .15s;margin-bottom:12px;font-family:inherit;}
  .login-card input:focus{border-color:var(--accent);}
  .btn-primary{width:100%;padding:10px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit;}
  .btn-primary:hover{background:var(--accent-dk);}

  /* NAV */
  nav{background:var(--header);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;}
  .nav-brand{display:flex;align-items:center;gap:10px;}
  .nav-brand-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;}
  .nav-brand-name{font-size:15px;font-weight:700;color:white;letter-spacing:-.2px;}
  .nav-brand-name span{color:#A5B4FC;}
  .nav-tabs{display:flex;gap:2px;margin-left:16px;}
  .nav-tab{background:none;border:none;color:rgba(255,255,255,.6);padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .nav-tab:hover{background:rgba(255,255,255,.15);color:white;}
  .nav-tab.active{background:rgba(255,255,255,.2);color:white;}
  .nav-spacer{flex:1;}
  .nav-user{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-size:13px;}
  .nav-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:600;}
  .btn-icon{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);border-radius:var(--radius-sm);padding:5px 12px;font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;font-family:inherit;}
  .btn-icon:hover{background:rgba(255,255,255,.15);color:white;}

  /* VIEWS */
  .view{display:none;}
  .view.active{display:block;}

  /* BOARD */
  .board-header{padding:20px 24px 0;display:flex;align-items:center;gap:12px;}
  .board-header h2{font-size:18px;font-weight:700;}
  .count-badge{font-size:12px;color:var(--muted);background:var(--white);border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .board{display:flex;gap:16px;padding:20px 24px 32px;overflow-x:auto;min-height:calc(100vh - 130px);align-items:flex-start;}
  .column{flex:1 1 260px;display:flex;flex-direction:column;min-width:200px;}
  .col-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;border-bottom:2px solid var(--border);margin-bottom:12px;}
  .col-header.inbox{border-color:var(--s-inbox-fg);}
  .col-header.doing{border-color:var(--s-doing-fg);}
  .col-header.valid{border-color:var(--s-valid-fg);}
  .col-header.done{border-color:var(--s-done-fg);}
  .col-header.blocked{border-color:var(--s-block-fg);}
  .col-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
  .col-pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;}
  .pill-inbox{background:var(--s-inbox-bg);color:var(--s-inbox-fg);}
  .pill-doing{background:var(--s-doing-bg);color:var(--s-doing-fg);}
  .pill-valid{background:var(--s-valid-bg);color:var(--s-valid-fg);}
  .pill-done{background:var(--s-done-bg);color:var(--s-done-fg);}
  .pill-blocked{background:var(--s-block-bg);color:var(--s-block-fg);}
  .col-add-btn{background:none;border:none;cursor:pointer;color:var(--light);font-size:18px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:all .15s;}
  .col-add-btn:hover{background:var(--border);color:var(--text);}
  .cards-area{display:flex;flex-direction:column;gap:8px;min-height:80px;border-radius:var(--radius);padding:4px;transition:background .15s;}
  .cards-area.drag-over{background:rgba(99,102,241,.06);outline:2px dashed var(--accent);outline-offset:-2px;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s,opacity .15s;position:relative;}
  .card:hover{box-shadow:var(--shadow);border-color:var(--border2);}
  .card.dragging{opacity:.35;}
  .card-menu{position:absolute;top:10px;right:10px;display:none;gap:4px;}
  .card:hover .card-menu{display:flex;}
  .card-menu-btn{background:var(--bg);border:1px solid var(--border);border-radius:5px;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;transition:all .15s;}
  .card-menu-btn:hover{background:var(--white);color:var(--text);}
  .card-title{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:8px;padding-right:52px;}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .tag-inbox{background:var(--s-inbox-bg);color:var(--s-inbox-fg);}
  .tag-doing{background:var(--s-doing-bg);color:var(--s-doing-fg);}
  .tag-valid{background:var(--s-valid-bg);color:var(--s-valid-fg);}
  .tag-done{background:var(--s-done-bg);color:var(--s-done-fg);}
  .tag-blocked{background:var(--s-block-bg);color:var(--s-block-fg);}
  .tag-alta{background:var(--p-high-bg);color:var(--p-high-fg);}
  .tag-media{background:var(--p-med-bg);color:var(--p-med-fg);}
  .tag-baixa{background:var(--p-low-bg);color:var(--p-low-fg);}
  .tag-cat{background:#F4F3F0;color:#706E68;}
  .card-footer{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .card-owner{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
  .avatar-sm{width:20px;height:20px;border-radius:50%;background:var(--s-inbox-bg);color:var(--s-inbox-fg);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card-spacer{flex:1;}
  .card-deadline{font-size:10px;color:var(--light);}
  .card-deadline.overdue{color:var(--s-block-fg);font-weight:600;}
  .prog-wrap{margin-top:10px;}
  .prog-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:2px;transition:width .3s;}
  .prog-label{font-size:10px;color:var(--muted);text-align:right;margin-top:2px;}
  .add-card{display:flex;align-items:center;gap:6px;background:none;border:1px dashed var(--border2);border-radius:var(--radius);padding:8px 12px;cursor:pointer;color:var(--light);font-size:12px;font-family:inherit;width:100%;margin-top:4px;transition:all .15s;}
  .add-card:hover{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.04);}
  .empty{padding:24px 12px;text-align:center;color:var(--light);font-size:12px;line-height:1.6;}

  /* PAINEL */
  .painel-wrap{padding:24px;}
  .painel-top{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .painel-top h2{font-size:18px;font-weight:700;flex:1;}
  .painel-top select{padding:7px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;background:var(--white);color:var(--text);cursor:pointer;}
  .painel-top select:focus{border-color:var(--accent);}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px;}
  .kpi-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .kpi-value{font-size:28px;font-weight:700;color:var(--text);}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .person-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .person-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .person-avatar{width:40px;height:40px;border-radius:50%;background:var(--s-inbox-bg);color:var(--s-inbox-fg);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .person-name{font-size:15px;font-weight:600;}
  .person-sub{font-size:12px;color:var(--muted);}
  .person-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .pstat{text-align:center;background:var(--bg);border-radius:8px;padding:8px 4px;}
  .pstat-val{font-size:18px;font-weight:700;}
  .pstat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
  .pstat.s-inbox .pstat-val{color:var(--s-inbox-fg);}
  .pstat.s-doing .pstat-val{color:var(--s-doing-fg);}
  .pstat.s-valid .pstat-val{color:var(--s-valid-fg);}
  .pstat.s-done .pstat-val{color:var(--s-done-fg);}
  .person-prog{margin-top:4px;}
  .person-prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .person-prog-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
  .person-prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s;}
  .no-data{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;}

  /* MODAL */
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--white);border-radius:14px;padding:28px;width:460px;max-width:95vw;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .modal-header h3{font-size:16px;font-weight:600;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;}
  .modal-close:hover{color:var(--text);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;transition:border .15s;background:var(--white);color:var(--text);}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;}
  .btn-cancel{padding:9px 18px;background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s;}
  .btn-cancel:hover{background:var(--bg);}
  .btn-save{padding:9px 20px;background:var(--accent);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;color:white;font-family:inherit;transition:background .15s;}
  .btn-save:hover{background:var(--accent-dk);}

  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--header);color:white;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

    <select id="filter-priority" onchange="renderBoard()" style="padding:5px 12px;border:1px solid var(--border2);border-radius:20px;font-size:12px;font-family:inherit;outline:none;background:var(--white);color:var(--text);cursor:pointer;">
      <option value="">Todas as prioridades</option>
      <option>Alta</option>
      <option>Média</option>
      <option>Baixa</option>
    </select>
    <button onclick="document.getElementById('filter-owner').value='';document.getElementById('filter-priority').value='';renderBoard()" style="padding:5px 12px;border:1px solid var(--border2);border-radius:20px;font-size:12px;font-family:inherit;background:none;color:var(--muted);cursor:pointer;">✕ Limpar</button>
    <span id="filter-info" style="font-size:12px;color:var(--muted);margin-left:4px;"></span>
  </div>
  <div class="board" id="board">
    <div class="loading"><span class="spinner"></span>Carregando...</div>
  </div>
</div>

<!-- PAINEL VIEW -->
<div id="view-painel" class="view">
  <div class="painel-wrap">
    <div class="painel-top">

      <select id="filter-month" onchange="renderPainel()">

      </select>
      <select id="filter-year" onchange="renderPainel()">
        <option value="">Todos os anos</option>
      </select>
    </div>
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="people-grid" id="people-grid">
      <div class="loading"><span class="spinner"></span>Carregando...</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Novo card</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="field"><label>Tarefa *</label><input type="text" id="f-title" placeholder="Nome da tarefa..."/></div>
    <div class="field"><label>Descrição</label><textarea id="f-desc" placeholder="Detalhes opcionais..."></textarea></div>
    <div class="field-row">
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option>Entrada</option><option>Fazendo</option><option>Validação</option><option>Concluído</option>
        </select>
      </div>
      <div class="field"><label>Prioridade</label>
        <select id="f-priority"><option>Alta</option><option>Média</option><option>Baixa</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Responsável</label>
      <select id="f-owner">
        <option value="">Sem responsável</option>
        <option>Davi Rangel</option>
        <option>Joyce Diana</option>
        <option>Keyla Lima</option>
        <option>Lilian Kroquevichy</option>
        <option>Rubia Vieira</option>

    </div>
      <div class="field"><label>Prazo</label><input type="date" id="f-deadline"/></div>

    <div class="field"><label>Categoria</label><input type="text" id="f-category" placeholder="Ex: Dev, Design, Marketing..."/></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveCard()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://swvovhkkvepnzxrmtzof.supabase.co'
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3dm92aGtrdmVwbnp4cm10em9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODkzNjksImV4cCI6MjA5NjU2NTM2OX0.0zYNf-j0pFtej_C_ZRHBWhEJrdC69GiIzWJXRmDMBj4'
const{createClient}=supabase
const db=createClient(SUPABASE_URL,SUPABASE_KEY)

let cards=[],currentUser='',editingId=null,dragId=null

// ── Auth ──────────────────────────────────────────────────────────────────
function doLogin(){
  const name=document.getElementById('login-input').value.trim()
  if(!name)return
  currentUser=name
  localStorage.setItem('kanban_user',name)
  document.getElementById('login-screen').style.display='none'
  document.getElementById('nav-name').textContent=name
  document.getElementById('nav-avatar').textContent=name.slice(0,2).toUpperCase()
  document.getElementById('f-owner').value=name
  initApp()
}
function logout(){localStorage.removeItem('kanban_user');location.reload()}
const saved=localStorage.getItem('kanban_user')
if(saved){currentUser=saved;document.getElementById('login-input').value=saved;doLogin()}
document.getElementById('login-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})

// ── Views ─────────────────────────────────────────────────────────────────
function showView(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'))
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'))
  document.getElementById('view-'+name).classList.add('active')
  btn.classList.add('active')
  if(name==='painel')renderPainel()
}

// ── Init ──────────────────────────────────────────────────────────────────
async function initApp(){
  await loadCards()
  subscribeRealtime()
  populateFilters()
}

async function loadCards(){
  const{data,error}=await db.from('cards').select('*').order('created_at')
  if(error){showToast('Erro: '+error.message);return}
  cards=data||[]
  renderBoard()
}

function subscribeRealtime(){
  db.channel('cards-ch').on('postgres_changes',{event:'*',schema:'public',table:'cards'},()=>loadCards()).subscribe()
}

// ── Board ─────────────────────────────────────────────────────────────────
const COLS=[
  {id:'Entrada',  cls:'inbox',  pillCls:'pill-inbox',  tagCls:'tag-inbox'},
  {id:'Fazendo',  cls:'doing',  pillCls:'pill-doing',  tagCls:'tag-doing'},
  {id:'Validação',cls:'valid',  pillCls:'pill-valid',  tagCls:'tag-valid'},
  {id:'Concluído',cls:'done',   pillCls:'pill-done',   tagCls:'tag-done'},
]

function renderBoard(){
  const board=document.getElementById('board')
  board.innerHTML=''
  document.getElementById('total-count').textContent=cards.length+' tarefa'+(cards.length!==1?'s':'')
  const ownerF=document.getElementById('filter-owner')?.value||''
  const prioF=document.getElementById('filter-priority')?.value||''
  const filtered=cards.filter(c=>{
    if(ownerF&&c.owner!==ownerF)return false
    if(prioF&&c.priority!==prioF)return false
    return true
  })
  const info=document.getElementById('filter-info')
  if(info){
    if(ownerF||prioF){
      info.textContent=filtered.length+' tarefa'+(filtered.length!==1?'s':'')+' encontrada'+(filtered.length!==1?'s':'')
    } else {
      info.textContent=''
    }
  }
  COLS.forEach(col=>{
    const cc=filtered.filter(c=>c.status===col.id)
    const colEl=document.createElement('div')
    colEl.className='column'
    colEl.innerHTML=`
      <div class="col-header ${col.cls}">
        <div class="col-title">${col.id}<span class="col-pill ${col.pillCls}">${cc.length}</span></div>
        <button class="col-add-btn" onclick="openModal('${col.id}')">+</button>
      </div>
      <div class="cards-area" id="area-${col.id}">${cc.length===0?'<div class="empty">Sem tarefas</div>':''}</div>
`
    board.appendChild(colEl)
    const area=colEl.querySelector('.cards-area')
    cc.forEach(card=>area.appendChild(buildCard(card)))
    setupDrop(area,col.id)
  })
}

function buildCard(card){
  const el=document.createElement('div')
  el.className='card';el.draggable=true;el.dataset.id=card.id
  const statusCls=COLS.find(c=>c.id===card.status)?.tagCls||'tag-inbox'
  const prioCls={'Alta':'tag-alta','Média':'tag-media','Baixa':'tag-baixa'}[card.priority]||'tag-media'
  let deadlineHtml=''
  if(card.deadline){
    const raw=card.deadline.includes('T')?card.deadline:card.deadline+'T12:00:00'
    const d=new Date(raw)
    const today=new Date();today.setHours(0,0,0,0)
    const dDay=new Date(d);dDay.setHours(0,0,0,0)
    const diff=Math.round((dDay-today)/(1000*60*60*24))
    const done=card.status==='Concluído'
    let dlBg,dlColor,dlIcon,dlLabel
    if(done){dlBg='#D1FAE5';dlColor='#065F46';dlIcon='✓';dlLabel=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
    else if(diff<0){dlBg='#FEE2E2';dlColor='#991B1B';dlIcon='⚠';dlLabel='Atrasado '+Math.abs(diff)+'d'}
    else if(diff===0){dlBg='#FEF3C7';dlColor='#92400E';dlIcon='●';dlLabel='Vence hoje'}
    else if(diff<=3){dlBg='#FEF3C7';dlColor='#92400E';dlIcon='●';dlLabel=diff+'d restantes'}
    else{dlBg='#D1FAE5';dlColor='#065F46';dlIcon='●';dlLabel=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
    deadlineHtml='<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:'+dlColor+';background:'+dlBg+';padding:3px 8px;border-radius:20px;margin-top:6px;">'+dlIcon+' '+dlLabel+'</span>'
  }
  const ini=card.owner?card.owner.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase():''
  el.innerHTML=`
    <div class="card-menu">
      <button class="card-menu-btn" onclick="editCard('${card.id}')">✏</button>
      <button class="card-menu-btn" onclick="deleteCard('${card.id}')" style="color:#991B1B">✕</button>
    </div>
    <div class="card-title">${escHtml(card.title)}</div>
    <div class="card-tags">
      <span class="tag ${statusCls}">${card.status}</span>
      ${card.priority?`<span class="tag ${prioCls}">${card.priority}</span>`:''}
      ${card.category?`<span class="tag tag-cat">${escHtml(card.category)}</span>`:''}
    </div>
    <div class="card-footer">
      ${card.owner?`<div class="card-owner"><div class="avatar-sm">${ini}</div>${escHtml(card.owner)}</div>`:''}
      <div class="card-spacer"></div>
    </div>
    ${deadlineHtml}
`
  el.addEventListener('click',e=>{if(!e.target.closest('.card-menu'))editCard(card.id)})
  el.addEventListener('dragstart',()=>{dragId=card.id;setTimeout(()=>el.classList.add('dragging'),0)})
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragId=null})
  return el
}

function setupDrop(area,status){
  area.addEventListener('dragover',e=>{e.preventDefault();area.classList.add('drag-over')})
  area.addEventListener('dragleave',()=>area.classList.remove('drag-over'))
  area.addEventListener('drop',async e=>{
    e.preventDefault();area.classList.remove('drag-over')
    if(!dragId)return
    const card=cards.find(c=>c.id===dragId)
    if(!card||card.status===status)return
    const idx=cards.findIndex(c=>c.id===dragId)
    if(idx>=0){cards[idx].status=status;renderBoard()}
    db.from('cards').update({status}).eq('id',dragId).then(({error})=>{
      if(error){showToast('Erro ao mover');loadCards()}else{showToast('Movido para '+status)}
    })
  })
}

// ── Painel ────────────────────────────────────────────────────────────────
function populateFilters(){
  const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
  const mSel=document.getElementById('filter-month')
  months.forEach((m,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=m;mSel.appendChild(o)})
  const years=[...new Set(cards.map(c=>new Date(c.created_at).getFullYear()))].sort((a,b)=>b-a)
  const ySel=document.getElementById('filter-year')
  years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;ySel.appendChild(o)})
  // set current month/year as default
  const now=new Date()
  mSel.value=now.getMonth()+1
  ySel.value=now.getFullYear()
}

function getFilteredCards(){
  const m=document.getElementById('filter-month').value
  const y=document.getElementById('filter-year').value
  return cards.filter(c=>{
    const d=new Date(c.created_at)
    if(m&&d.getMonth()+1!=m)return false
    if(y&&d.getFullYear()!=y)return false
    return true
  })
}

function renderPainel(){
  const fc=getFilteredCards()
  // KPIs
  const total=fc.length
  const done=fc.filter(c=>c.status==='Concluído').length
  const doing=fc.filter(c=>c.status==='Fazendo').length
  const blocked=fc.filter(c=>c.status==='Concluído').length
  const pct=total?Math.round(done/total*100):0
  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpi-card"><div class="kpi-label">Total</div><div class="kpi-value">${total}</div><div class="kpi-sub">tarefas no período</div></div>
    <div class="kpi-card"><div class="kpi-label">Concluídas</div><div class="kpi-value" style="color:#065F46">${done}</div><div class="kpi-sub">${pct}% do total</div></div>
    <div class="kpi-card"><div class="kpi-label">Em andamento</div><div class="kpi-value" style="color:#92400E">${doing}</div><div class="kpi-sub">tarefas ativas</div></div>
    <div class="kpi-card"><div class="kpi-label">Concluídas</div><div class="kpi-value" style="color:#065F46">${blocked}</div><div class="kpi-sub">no período</div></div>
  `
  // Por pessoa
  const people=[...new Set(fc.map(c=>c.owner).filter(Boolean))].sort()
  const grid=document.getElementById('people-grid')
  if(!people.length){grid.innerHTML='<div class="no-data">Nenhuma tarefa com responsável no período selecionado.</div>';return}
  grid.innerHTML=''
  const avatarColors=[
    ['#EEEDFE','#4740B6'],['#D1FAE5','#065F46'],['#E0F2FE','#075985'],
    ['#FEF3C7','#92400E'],['#FCE7F3','#9D174D'],['#F3E8FF','#7E22CE'],
  ]
  people.forEach((person,idx)=>{
    const pc=fc.filter(c=>c.owner===person)
    const [abg,afg]=avatarColors[idx%avatarColors.length]
    const ini=person.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
    const nInbox=pc.filter(c=>c.status==='Entrada').length
    const nDoing=pc.filter(c=>c.status==='Fazendo').length
    const nValid=pc.filter(c=>c.status==='Validação').length
    const nDone=pc.filter(c=>c.status==='Concluído').length
    const ppct=pc.length?Math.round(nDone/pc.length*100):0
    const card=document.createElement('div')
    card.className='person-card'
    card.innerHTML=`
      <div class="person-header">
        <div class="person-avatar" style="background:${abg};color:${afg}">${ini}</div>
        <div>
          <div class="person-name">${escHtml(person)}</div>
          <div class="person-sub">${pc.length} tarefa${pc.length!==1?'s':''} no período</div>
        </div>
      </div>
      <div class="person-stats">
        <div class="pstat s-inbox"><div class="pstat-val">${nInbox}</div><div class="pstat-lbl">Entrada</div></div>
        <div class="pstat s-doing"><div class="pstat-val">${nDoing}</div><div class="pstat-lbl">Fazendo</div></div>
        <div class="pstat s-valid"><div class="pstat-val">${nValid}</div><div class="pstat-lbl">Validação</div></div>
        <div class="pstat s-done"><div class="pstat-val">${nDone}</div><div class="pstat-lbl">Concluído</div></div>
      </div>
      <div class="person-prog">
        <div class="person-prog-label"><span>Progresso geral</span><span style="font-weight:600;color:var(--accent)">${ppct}%</span></div>
        <div class="person-prog-bar"><div class="person-prog-fill" style="width:${ppct}%"></div></div>
      </div>`
    grid.appendChild(card)
  })
}

// ── CRUD ──────────────────────────────────────────────────────────────────
function openModal(status){
  editingId=null
  document.getElementById('modal-title').textContent='Novo card'
  document.getElementById('f-title').value=''
  document.getElementById('f-desc').value=''
  document.getElementById('f-status').value='Entrada'
  document.getElementById('f-priority').value='Média'
  document.getElementById('f-owner').value=currentUser
  document.getElementById('f-deadline').value=''
  document.getElementById('f-category').value=''
  document.getElementById('modal').classList.add('open')
  setTimeout(()=>document.getElementById('f-title').focus(),50)
}

function editCard(id){
  const c=cards.find(x=>x.id===id);if(!c)return
  editingId=id
  document.getElementById('modal-title').textContent='Editar card'
  document.getElementById('f-title').value=c.title||''
  document.getElementById('f-desc').value=c.description||''
  document.getElementById('f-status').value=c.status||'Entrada'
  document.getElementById('f-priority').value=c.priority||'Média'
  document.getElementById('f-owner').value=c.owner||''
  document.getElementById('f-deadline').value=c.deadline||''
  document.getElementById('f-category').value=c.category||''
  document.getElementById('modal').classList.add('open')
}

async function saveCard(){
  const title=document.getElementById('f-title').value.trim()
  if(!title){document.getElementById('f-title').focus();return}
  const payload={
    title,
    description:document.getElementById('f-desc').value.trim(),
    status:document.getElementById('f-status').value,
    priority:document.getElementById('f-priority').value,
    owner:document.getElementById('f-owner').value.trim(),
    deadline:document.getElementById('f-deadline').value||null,
    category:document.getElementById('f-category').value.trim(),
  }
  closeModal()
  if(editingId){
    const idx=cards.findIndex(c=>c.id===editingId)
    if(idx>=0){cards[idx]={...cards[idx],...payload};renderBoard()}
    db.from('cards').update(payload).eq('id',editingId).then(({error})=>{
      if(error){showToast('Erro ao salvar');loadCards()}else{showToast('Card atualizado ✓')}
    })
  }else{
    const temp={id:'temp-'+Date.now(),...payload,created_at:new Date().toISOString()}
    cards.push(temp);renderBoard()
    db.from('cards').insert(payload).select().then(({data,error})=>{
      if(error){showToast('Erro ao criar');cards=cards.filter(c=>c.id!==temp.id);renderBoard()}
      else{cards=cards.filter(c=>c.id!==temp.id);if(data?.[0])cards.push(data[0]);renderBoard();showToast('Card criado ✓')}
    })
  }
}

async function deleteCard(id){
  const c=cards.find(x=>x.id===id);if(!c)return
  if(!confirm(`Pricing Gestão\n\nDeseja excluir o card "${c.title}"?`))return
  cards=cards.filter(x=>x.id!==id);renderBoard()
  db.from('cards').delete().eq('id',id).then(({error})=>{
    if(error){showToast('Erro ao excluir');loadCards()}else{showToast('Card excluído')}
  })
}

function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()})
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
